<!doctype html>
<html lang="it" data-materia="metodi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metodi · Appunti interattivi</title>
<script>try{var t=JSON.parse(localStorage.getItem("appunti:tema"));if(t==="chiaro")document.documentElement.dataset.theme="light";else if(t==="scuro")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600;700&family=Kalam:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap">
<link rel="stylesheet" href="../../assets/css/base.css">
</head>
<!-- Pagina indice di una materia: si riempie da sola leggendo assets/js/materie.js.
     Per una nuova materia copia questo file in materie/<id>/index.html e cambia data-materia. -->
<body data-root="../../">
<div id="barra"></div>
<div class="pagina">
  <main class="foglio" style="grid-column:1 / -1">
    <header class="intestazione">
      <span class="etichetta"><a href="../../index.html">Libreria</a> › Quaderno</span>
      <h1 id="titolo-materia"></h1>
      <p class="lede" id="descr-materia"></p>
    </header>
    <section style="display:grid;gap:12px">
      <span class="etichetta">Indice degli argomenti</span>
      <div id="argomenti-materia"></div>
    </section>
  </main>
</div>
<script src="../../assets/js/materie.js"></script>
<script src="../../assets/js/core.js"></script>
</body>
</html>
